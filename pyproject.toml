[build-system]
requires = ["setuptools==84.2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nullxes-shinra"
version = "0.1.0"
description = "NULLXES SHINRA 40B native routed Mixture of Experts"
readme = "Readme.md"
requires-python = ">=3.10"
authors = [{name = "NULLXES", email = "ceo@nullxes.com"}]
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
where = ["src"]
include = ["shinra*"]
namespaces = false
